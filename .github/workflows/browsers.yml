name: Browsers
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-
      - run: npx playwright install chromium firefox webkit
      # Firefox needs a real audio backend even in headless mode. CoreAudio is
      # native on these runners. Start a PulseAudio null sink only if Homebrew
      # already provided the binaries — do not apt or brew install here.
      - name: Start audio backend
        run: |
          if command -v pulseaudio >/dev/null 2>&1 && command -v pactl >/dev/null 2>&1; then
            echo "Using Homebrew PulseAudio null sink"
            pulseaudio --check || pulseaudio --start --exit-idle-time=-1
            pactl load-module module-null-sink sink_name=sfx 2>/dev/null || true
            pactl set-default-sink sfx
          else
            echo "Using native CoreAudio (PulseAudio not on PATH)"
          fi
      # Headful Firefox on macOS exposes desktop fine-pointer media queries
      # without Xvfb.
      - run: npm run test:browser
      - name: Build and verify static docs and preserved demos
        env:
          NEXT_PUBLIC_BASE_PATH: /sfx
          NEXT_PUBLIC_SITE_URL: https://bloxwap.github.io
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm run docs:build
          npm run docs:preview > "$RUNNER_TEMP/sfx-docs-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          ready=0
          i=0
          while [ "$i" -lt 60 ]; do
            if curl -fsS http://127.0.0.1:3903/sfx/ >/dev/null; then
              ready=1
              break
            fi
            i=$((i + 1))
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Docs preview did not become ready"
            cat "$RUNNER_TEMP/sfx-docs-preview.log" 2>/dev/null || true
            exit 1
          fi
          DOCS_URL=http://127.0.0.1:3903/sfx/ npm run docs:smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-traces
          path: |
            packages/sfx/test-results/
            apps/docs/test-results/
