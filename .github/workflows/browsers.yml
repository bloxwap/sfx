name: Browsers
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # Firefox needs a real audio backend even in headless mode. A PulseAudio null sink
      # supplies it without changing autoplay policy or mocking Web Audio.
      - name: Start audio backend
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=sfx
          pactl set-default-sink sfx
      # Headful Firefox under Xvfb exposes desktop fine-pointer media queries.
      - run: xvfb-run -a npm run test:browser
      - name: Build and verify static docs and preserved demos
        env:
          NEXT_PUBLIC_BASE_PATH: /sfx
          NEXT_PUBLIC_SITE_URL: https://bloxwap.github.io
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm run docs:build
          npm run docs:preview > /tmp/sfx-docs-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3903/sfx/ > /dev/null; then break; fi
            sleep 1
          done
          DOCS_URL=http://127.0.0.1:3903/sfx/ xvfb-run -a npm run docs:smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-traces
          path: |
            packages/sfx/test-results/
            apps/docs/test-results/
