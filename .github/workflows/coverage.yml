name: Coverage
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run coverage:lcov
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: packages/sfx/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
