name: Live docs smoke
on:
  workflow_run:
    workflows: [Documentation]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: docs-smoke-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      # Self-hosted minis already persist ~/Library/Caches/ms-playwright.
      # Do not upload that tree with actions/cache — it exceeded the job timeout.
      - run: npx playwright install chromium webkit
      - name: Start native audio backend
        run: |
          if command -v pulseaudio >/dev/null 2>&1 && command -v pactl >/dev/null 2>&1; then
            echo "Using Homebrew PulseAudio null sink"
            pulseaudio --check || pulseaudio --start --exit-idle-time=-1
            pactl load-module module-null-sink sink_name=sfx 2>/dev/null || true
            pactl set-default-sink sfx
          else
            echo "Using native CoreAudio (PulseAudio not on PATH)"
          fi
      - name: Verify the deployed docs in Chromium and WebKit
        run: npm run docs:smoke
        env:
          DOCS_URL: https://bloxwap.github.io/sfx/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: live-docs-traces
          path: apps/docs/test-results/
