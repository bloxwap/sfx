name: Documentation

on:
  push:
    branches: [main]
    paths: ['apps/**', 'packages/**', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  pull_request:
    paths: ['apps/**', 'packages/**', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    # Release scan, parallel with build. Skipped on PRs.
    if: github.event_name != 'pull_request'
    uses: bloxwap/.github/.github/workflows/security-scan.yml@6755bcc6a591531ae95a5babfa389c329f71ba0b # v1.0.2
    permissions:
      contents: read
    with:
      runs-on: '["self-hosted","macOS","ARM64"]'
      profile: release
      secrets-days: "7"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}

  build:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_BASE_PATH: /sfx
      NEXT_PUBLIC_SITE_URL: https://bloxwap.github.io
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run docs:build
      - run: npm run docs:check
      # Deploy only runs on main. Skip the Pages artifact on PRs (p50 ~45s) after
      # the build and docs:check have already validated the site.
      # upload-pages-artifact invokes gtar on macOS (BSD tar has no --hard-dereference).
      - name: Expose Homebrew GNU tar
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if command -v gtar >/dev/null 2>&1; then
            exit 0
          fi
          if command -v brew >/dev/null 2>&1; then
            prefix=$(brew --prefix gnu-tar 2>/dev/null || true)
            if [ -n "$prefix" ] && [ -x "$prefix/bin/gtar" ]; then
              echo "$prefix/libexec/gnubin" >> "$GITHUB_PATH"
              echo "$prefix/bin" >> "$GITHUB_PATH"
              exit 0
            fi
          fi
          echo "::error::gtar is required to upload the GitHub Pages artifact on macOS. Install Homebrew gnu-tar (see docs/ci-runners.md)."
          exit 1
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: apps/docs/out

  deploy:
    # Security: never run fork PR code on the self-hosted runner.
    if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [build, security]
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
