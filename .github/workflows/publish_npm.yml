name: Publish to npm

# Publishing a GitHub release publishes @bloxwap/sfx at the version in packages/sfx/package.json.
# Release flow: bump the version in a PR, merge it, then create a release tagged v<version>.
#
# npm OIDC and provenance require a GitHub-hosted runner; only publish is exempt
# from the Mac-mini runner policy. Keep this filename for the npm Trusted Publisher.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  security:
    # Single-job publish: adds the scan serially.
    uses: bloxwap/.github/.github/workflows/security-scan.yml@2a70724cd0d803abef5f5a7c64c46065f4fda19b # v1.1.0
    permissions:
      contents: read
    with:
      runs-on: '["self-hosted","macOS","ARM64"]'
      profile: release
      secrets-days: "7"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}

  publish:
    needs: security
    runs-on: ubuntu-24.04
    environment: npm-release
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        # Exact CLI bootstrap version is required for OIDC; it is not a project dependency.
        run: npm install --global npm@11.6.1 # zizmor: ignore[adhoc-packages]

      - run: npm ci

      - name: Determine version and npm tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # The private workspace root has no release version; the sfx package owns it.
          VERSION=$(node -p "require('./packages/sfx/package.json').version")
          # A release must be tagged for the version it publishes, or npm and GitHub disagree.
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match packages/sfx/package.json version v$VERSION"
            exit 1
          fi
          TAG=
          case "$VERSION" in
            *-alpha*) TAG=alpha ;;
            *-beta*) TAG=beta ;;
            *-rc*) TAG=rc ;;
          esac
          if [ -z "$TAG" ]; then
            case "$VERSION" in
              *-*) TAG=prerelease ;;
            esac
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "value=${TAG:-latest}" >> "$GITHUB_OUTPUT"

      # Check authentication even if the version below is already published.
      - name: Verify npm publish authentication
        # Transitional fallback: delete after the npm Trusted Publisher works.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node packages/sfx/scripts/check-publish-auth.ts

      - name: Skip if this version is already on npm
        id: exists
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if npm view "@bloxwap/sfx@$VERSION" version > /dev/null 2>&1; then
            echo "::warning::@bloxwap/sfx@$VERSION is already published"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # prepack builds and prepublishOnly runs the full test suite before anything is uploaded;
      # publishConfig.access is public.
      # Provenance is attached with either OIDC or the transitional token.
      - name: Publish @bloxwap/sfx@${{ steps.tag.outputs.version }}
        if: steps.exists.outputs.published != 'true'
        # Transitional fallback: delete after the npm Trusted Publisher works.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.tag.outputs.value }}
        run: npm publish --workspace @bloxwap/sfx --tag "$NPM_TAG" --provenance
