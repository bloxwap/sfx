name: Publish to npm

# Publishing a GitHub release publishes @bloxwap/sfx at the version in packages/sfx/package.json.
# Release flow: bump the version in a PR, merge it, then create a release tagged v<version>.
#
# Build and test on the Mac minis. Only the final upload uses a GitHub-hosted
# runner, required by npm trusted publishing.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  security:
    # Scan before preparing the release tarball.
    uses: bloxwap/.github/.github/workflows/security-scan.yml@2a70724cd0d803abef5f5a7c64c46065f4fda19b # v1.1.0
    permissions:
      contents: read
    with:
      runs-on: '["self-hosted","macOS","ARM64"]'
      profile: release
      secrets-days: "7"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}

  prepare:
    needs: security
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.value }}
      published: ${{ steps.exists.outputs.published }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Determine version and npm tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # The private workspace root has no release version; the sfx package owns it.
          VERSION=$(node -p "require('./packages/sfx/package.json').version")
          # A release must be tagged for the version it publishes, or npm and GitHub disagree.
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match packages/sfx/package.json version v$VERSION"
            exit 1
          fi
          TAG=
          case "$VERSION" in
            *-alpha*) TAG=alpha ;;
            *-beta*) TAG=beta ;;
            *-rc*) TAG=rc ;;
          esac
          if [ -z "$TAG" ]; then
            case "$VERSION" in
              *-*) TAG=prerelease ;;
            esac
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "value=${TAG:-latest}" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already on npm
        id: exists
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if npm view "@bloxwap/sfx@$VERSION" version > /dev/null 2>&1; then
            echo "::warning::@bloxwap/sfx@$VERSION is already published"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
        if: steps.exists.outputs.published != 'true'

      # npm test builds the library before running the full suite.
      - run: npm test
        if: steps.exists.outputs.published != 'true'

      - name: Pack the tested build
        if: steps.exists.outputs.published != 'true'
        id: pack
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          DIRECTORY=$(mktemp -d "$RUNNER_TEMP/sfx-publish.XXXXXX")
          npm pack --workspace @bloxwap/sfx --ignore-scripts --pack-destination "$DIRECTORY"
          mv "$DIRECTORY/bloxwap-sfx-$VERSION.tgz" "$DIRECTORY/package.tgz"
          echo "path=$DIRECTORY/package.tgz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.exists.outputs.published != 'true'
        id: artifact
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    runs-on: ubuntu-24.04
    environment: npm-release
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install pinned npm with trusted publishing support
        run: npm install --global npm@11.6.1 # zizmor: ignore[adhoc-packages]

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: ${{ runner.temp }}/npm-package
          merge-multiple: true

      - name: Publish @bloxwap/sfx@${{ needs.prepare.outputs.version }}
        env:
          # Transitional fallback until the npm Trusted Publisher is verified.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ needs.prepare.outputs.tag }}
        run: npm publish "$RUNNER_TEMP/npm-package/package.tgz" --access public --tag "$NPM_TAG" --ignore-scripts --provenance
