name: Publish to npm

# Publishing a GitHub release publishes @bloxwap/sfx at the version in packages/sfx/package.json.
# Release flow: bump the version in a PR, merge it, then create a release tagged v<version>.
#
# npm trusted publishing does not support self-hosted runners
# (https://docs.npmjs.com/trusted-publishers/). This job authenticates with the
# org-level NPM_TOKEN secret instead. That drops OIDC trusted publishing and
# automatic provenance.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  security:
    # Single-job publish: adds the scan serially.
    uses: bloxwap/.github/.github/workflows/security-scan.yml@6755bcc6a591531ae95a5babfa389c329f71ba0b # v1.0.2
    permissions:
      contents: read
    with:
      runs-on: '["self-hosted","macOS","ARM64"]'
      profile: release
      secrets-days: "7"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}

  publish:
    needs: security
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@v7
      # Keep npm new enough for the same CLI surface we already validate.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm ci

      - name: Determine version and npm tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # The private workspace root has no release version; the sfx package owns it.
          VERSION=$(node -p "require('./packages/sfx/package.json').version")
          # A release must be tagged for the version it publishes, or npm and GitHub disagree.
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match packages/sfx/package.json version v$VERSION"
            exit 1
          fi
          TAG=
          case "$VERSION" in
            *-alpha*) TAG=alpha ;;
            *-beta*) TAG=beta ;;
            *-rc*) TAG=rc ;;
          esac
          if [ -z "$TAG" ]; then
            case "$VERSION" in
              *-*) TAG=prerelease ;;
            esac
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "value=${TAG:-latest}" >> "$GITHUB_OUTPUT"

      - name: Check npm CLI
        run: |
          npm --version
          npx --yes semver -r '>=11.5.1' "$(npm --version)" > /dev/null || npm install -g npm@latest

      # Check authentication even if the version below is already published.
      - name: Verify npm publish authentication
        run: node packages/sfx/scripts/check-publish-auth.ts

      - name: Skip if this version is already on npm
        id: exists
        run: |
          if npm view "@bloxwap/sfx@${{ steps.tag.outputs.version }}" version > /dev/null 2>&1; then
            echo "::warning::@bloxwap/sfx@${{ steps.tag.outputs.version }} is already published"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # prepack builds and prepublishOnly runs the full test suite before anything is uploaded;
      # publishConfig.access is public.
      # Token publish does not attach provenance (trusted publishing is unavailable here).
      - name: Publish @bloxwap/sfx@${{ steps.tag.outputs.version }}
        if: steps.exists.outputs.published != 'true'
        run: npm publish --workspace @bloxwap/sfx --tag ${{ steps.tag.outputs.value }}
