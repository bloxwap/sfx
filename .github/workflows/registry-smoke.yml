name: Registry smoke
on:
  workflow_run:
    workflows: [Publish to npm]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Exact npm version to verify
        default: '0.2.0'
        type: string
permissions:
  contents: read
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      # Test infrastructure lives on main, including when the release predates this workflow.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      # Self-hosted minis already persist ~/Library/Caches/ms-playwright.
      # Do not upload that tree with actions/cache — it exceeded the job timeout.
      - run: npx playwright install chromium
      - name: Verify the published version
        run: |
          if [ -z "$SMOKE_VERSION" ]; then
            SMOKE_VERSION=$(npm view @bloxwap/sfx version)
          fi
          npm run smoke:registry -- "$SMOKE_VERSION"
        env:
          SMOKE_VERSION: ${{ inputs.version }}
