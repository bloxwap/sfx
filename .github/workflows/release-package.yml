name: Prepare npm release
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing release tag matching the package version
        default: v0.2.1
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep the preparation script outside the release checkout
        run: cp packages/sfx/scripts/prepare-release.ts "$RUNNER_TEMP/sfx-prepare-release.ts"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      # Match the CLI used for the one-time local publish with --provenance-file.
      - run: npm install -g npm@11.15.0
      - run: npm ci
      - run: npm test
      - name: Pack and sign the exact release tarball
        run: |
          mkdir -p "$SFX_RELEASE_DIRECTORY"
          npm pack --workspace @bloxwap/sfx --pack-destination "$SFX_RELEASE_DIRECTORY"
          SFX_NPM_MODULES="$(npm root -g)"
          export SFX_NPM_MODULES
          node "$RUNNER_TEMP/sfx-prepare-release.ts"
        env:
          SFX_RELEASE_DIRECTORY: ${{ runner.temp }}/sfx-npm-release
          SFX_SOURCE_REF: ${{ inputs.source_ref }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sfx-release-with-provenance
          path: ${{ runner.temp }}/sfx-npm-release/
          retention-days: 7
