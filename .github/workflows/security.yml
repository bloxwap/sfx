name: Security

on:
  pull_request:
  # Weekly: advisories for already-merged dependencies appear between PRs.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: npm audit (runtime + tooling)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      # The published package has zero runtime dependencies; this gates the build and docs toolchain.
      - run: npm audit --audit-level=high
      - name: Published package has no runtime dependencies
        run: |
          node -e "const p=require('./packages/sfx/package.json'); const d=Object.keys(p.dependencies??{}); if(d.length){console.error('runtime deps:',d);process.exit(1)} console.log('0 runtime dependencies')"
