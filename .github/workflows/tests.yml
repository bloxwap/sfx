name: Tests

# Gates pull requests (and main) on the same checks contributors run locally.
# Doc-only PRs skip the test job; skipped jobs still satisfy the required check.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' && 'true' || (steps.filter.outputs.code == 'true' || steps.filter.outputs.packaged == 'true') && 'true' || 'false' }}
    steps:
      # Skip doc-only PRs; keep MDX docs-site inputs and all non-PR events running.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/pull_request_template.md'
              - '!CODEOWNERS'
            # The pack dry run requires the packaged README and LICENSE.
            packaged:
              - 'packages/sfx/README.md'
              - 'packages/sfx/LICENSE'

  test:
    needs: changes
    # Security: never run fork PR code on the self-hosted runner.
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Builds, runs the suite, and fails if any source file drops below the coverage thresholds.
      - name: Tests and coverage gate
        run: npm run coverage

      - name: Bundle size budget
        run: npm run size

      - name: Scheduling benchmark
        run: npm run bench

      # Tests import dist/ directly, so check the published entry points separately: every
      # "exports" subpath must import by package name in plain Node (SSR-safe, no window).
      - name: Package entry points
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const { name, exports } = JSON.parse(readFileSync('packages/sfx/package.json', 'utf8'));
            for (const key of Object.keys(exports)) {
              if (key.endsWith('.json') || key.includes('*')) continue;
              await import(key === '.' ? name : name + key.slice(1));
            }
            console.log('imported', Object.keys(exports).length, 'entry points');
          "

      # What npm would publish: fails if the tarball is missing dist/ or ships sources/tests.
      - name: Pack dry run
        run: |
          npm pack --workspace @bloxwap/sfx --dry-run --json > pack.json
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const [{ files }] = JSON.parse(readFileSync('pack.json', 'utf8'));
            const paths = files.map((f) => f.path);
            for (const required of ['dist/index.js', 'dist/index.d.ts', 'README.md', 'LICENSE', 'package.json']) {
              if (!paths.includes(required)) throw new Error('tarball is missing ' + required);
            }
            const stray = paths.filter((p) => /^(src|test|bench)\//.test(p));
            if (stray.length) throw new Error('tarball ships ' + stray.join(', '));
            console.log(paths.length, 'files in tarball');
          "
