name: TEMPORARY Ubuntu publish dry-run (remove before merge)

# Temporary PR-only validation of the Ubuntu publish lifecycle. Remove before merge.
on:
  pull_request:

permissions:
  contents: read

jobs:
  publish-dryrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        # Exact CLI bootstrap version is required for OIDC; it is not a project dependency.
        run: npm install --global npm@11.6.1 # zizmor: ignore[adhoc-packages]

      - run: npm ci

      # npm 11.6.1 checks registry version collisions even in dry-run mode.
      - name: Use a unique unpublished rehearsal version
        run: npm pkg set "version=0.0.0-dry-run.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" --workspace @bloxwap/sfx

      - name: Determine version and npm tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # The private workspace root has no release version; the sfx package owns it.
          VERSION=$(node -p "require('./packages/sfx/package.json').version")
          # A release must be tagged for the version it publishes, or npm and GitHub disagree.
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match packages/sfx/package.json version v$VERSION"
            exit 1
          fi
          TAG=
          case "$VERSION" in
            *-alpha*) TAG=alpha ;;
            *-beta*) TAG=beta ;;
            *-rc*) TAG=rc ;;
          esac
          if [ -z "$TAG" ]; then
            case "$VERSION" in
              *-*) TAG=prerelease ;;
            esac
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "value=${TAG:-latest}" >> "$GITHUB_OUTPUT"

      # No registry auth or existing-version skip: exercise prepublishOnly and prepack.
      - name: Dry-run publish
        env:
          NPM_TAG: ${{ steps.tag.outputs.value }}
        run: npm publish --workspace @bloxwap/sfx --tag "$NPM_TAG" --provenance --dry-run
